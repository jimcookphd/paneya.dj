<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P4#!Я — Paneya DJ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <header>
    <strong>P4#!Я</strong>
    <span>paneya.dj · future funk / bass / experiments</span>
  </header>
  <main>
    <div id="winamp-container" aria-label="Classic Winamp music player"></div>
    <section class="terminal" aria-label="danceOS terminal">
      <div class="bar">▣ anonymous@dance:~ <span>□ ×</span></div>
      <div id="output" class="output" aria-live="polite"></div>
      <form id="shell">
        <label for="command">anonymous@dance:~$</label>
        <input id="command" autocomplete="off" spellcheck="false" aria-label="Terminal command" disabled>
      </form>
    </section>
    <p class="note" id="status">Connecting to danceOS…</p>
  </main>
  <script type="module" src="player.js"></script>
  <script src="desktop.js" defer></script>
</body>
</html>
